<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
  html, body { margin: 0; background: transparent; }
  .wrap { display: flex; align-items: center; gap: 40px; padding: 30px 40px; width: max-content; }
  .mot { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; font-size: 150px; letter-spacing: -4px; line-height: 1; }
  .air { color: VAR_AIR; }
  .watt { color: #2BB673; }
  .devise { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 500; font-size: 30px; letter-spacing: 6px; text-transform: uppercase; color: VAR_DEV; margin-top: 14px; padding-left: 6px; }
</style></head>
<body>
<div class="wrap" id="logo">
  <svg width="240" height="240" viewBox="-120 -120 240 240" aria-label="Emblème AirWatt">
    <circle r="112" fill="#0F2A2E"/>
    <circle r="100" fill="none" stroke="#2BB673" stroke-width="3" stroke-opacity="0.45" stroke-dasharray="6 10"/>
    <g id="pale">
      <path d="M0,-14 C 26,-26 40,-58 6,-90 C -30,-64 -30,-34 0,-14 Z" fill="#2BB673"/>
      <path d="M0,-18 C 4,-40 6,-62 6,-86" fill="none" stroke="#0F2A2E" stroke-width="4" stroke-linecap="round"/>
    </g>
    <use href="#pale" transform="rotate(120)"/>
    <use href="#pale" transform="rotate(240)"/>
    <circle r="16" fill="#F6F7F2"/>
    <circle r="6" fill="#0F2A2E"/>
  </svg>
  <div>
    <div class="mot"><span class="air">Air</span><span class="watt">Watt</span></div>
    <div class="devise">Ventiler juste, respirer mieux</div>
  </div>
</div>
</body></html>
