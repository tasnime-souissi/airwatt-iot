; AirWatt : passerelle ESP32
; Compiler :      pio run
; Téléverser :    pio run -t upload
; Moniteur série : pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; ../common contient le protocole BLE partagé avec le nœud
lib_extra_dirs = ../common
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
