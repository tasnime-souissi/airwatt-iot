; AirWatt — nœud capteur (ESP32 n°1)
;
; Deux configurations :
;   carte_seule      : ESP32 seule, mesures simulées, bouton BOOT = pic, LED intégrée (par défaut)
;   montage_complet  : PMS5003 (UART2) + BME280 (I2C) + ventilateur, LED RGB, buzzer
;
; Compiler :      pio run                      (ou : pio run -e montage_complet)
; Téléverser :    pio run -t upload            (ou : pio run -e montage_complet -t upload)
; Moniteur série : pio device monitor

[platformio]
default_envs = carte_seule

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; ../common contient le protocole BLE et la lecture du PMS5003, partagés avec la passerelle
lib_extra_dirs = ../common
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    adafruit/Adafruit BME280 Library@^2.2.4

[env:carte_seule]
build_flags = -DSIMULATED_SENSORS=1

[env:montage_complet]
build_flags = -DSIMULATED_SENSORS=0
